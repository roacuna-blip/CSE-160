<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Draw a blue rectangle (canvas version)</title>
  </head>

  <body onload="main()">
    <canvas id="cnv1" width="400" height="400">
      Please use a browser that supports "canvas"
    </canvas>
    <script src="asg0.js"></script>
    <script src="lib/cuon-matrix-cse160.js"></script>

    <br>

    <label for="name">V1:</label>

    <label for="name">X</label>
    <input type="number" id="xCoordV1" value="0" step="0.1">

    <label for="name">Y</label>
    <input type="number" id="yCoordV1" value="0" step="0.1">

    <br>

    <label for="name">V2:</label>

    <label for="name">X</label>
    <input type="number" id="xCoordV2" value="0" step="0.1">

    <label for="name">Y</label>
    <input type="number" id="yCoordV2" value="0" step="0.1">

    <br>
    <input type="button" value="Draw" onclick="handleDrawEvent()">
    <br><br>

    <label for="name">Operation:</label>

    <select id="operation">

      <option value="add">Add</option> 
      <option value="sub">Subtract</option> 
      <option value="mul">Multiply</option> 
      <option value="div">Divide</option> 
      <option value="angle">Angel Between</option>
      <option value="area">Area</option>
      <option value="magnitude">Magnitude</option> 
      <option value="normalize">Normalize</option>

    </select>

    <label for="name">Scalar:</label>
    <input type="number" id="scalar" value="0" step="0.1">

    <br>
    <input type="button" value="Draw" onclick="handleDrawOperationEvent()">
    <br>




  </body>
</html>
