<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Blocky Animal</title>
  </head>

  <body onload="main()">
    <canvas id="webgl" width="400" height="400">
    Please use a browser that supports "canvas"
    </canvas>
    <p>
    LowerLeg1 <input type="range" min="-45" max="45" value="0" class="slider" id="LowerLeg1Slider">
    Animation: 
    <button type="button" id="animationLowerLeg1OnButton">ON</button>
    <button type="button" id="animationLowerLeg1OffButton">OFF</button>
    <p>
    UpperLeg1 <input type="range" min="-45" max="45" value="0" class="slider" id="UpperLeg1Slider">
    Animation: 
    <button type="button" id="animationUpperLeg1OnButton">ON</button>
    <button type="button" id="animationUpperLeg1OffButton">OFF</button>
    <p>
    Paw1 <input type="range" min="-45" max="45" value="0" class="slider" id="Paw1Slider">
    Animation: 
    <button type="button" id="animationPaw1OnButton">ON</button>
    <button type="button" id="animationPaw1OffButton">OFF</button>
    <p>
    Camera Angle <input type="range" min="0" max="90" value="5" class="slider" id="angleSlider">
    <p>
      

    <script src="../lib/webgl-utils.js"></script>
    <script src="../lib/webgl-debug.js"></script>
    <script src="../lib/cuon-utils.js"></script>
    <script src="../lib/cuon-matrix.js"></script>
    <script src="Point.js"></script>
    <script src="Triangle.js"></script>
    <script src="Circle.js"></script>
    <script src="Cube.js"></script>
    <script src="Cylinder.js"></script>
    <script src="BlockyAnimal.js"></script>
  </body>
</html>
